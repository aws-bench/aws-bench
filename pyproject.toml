[project]
name = "aws-bench"
version = "0.7.0"
description = "A public benchmark with 100+ real-world AWS automation tasks for evaluating AI agent and LLM performance."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
license-files = ["LICENSE"]
authors = [
    {name = "Amazon Web Services"},
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "boto3>=1.42.0",
    "docker>=7.1.0",
    "harbor==0.9.0",
    "jinja2>=3.1.6",
    "mcp>=1.28.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "shortuuid>=1.0.13",
    "tenacity>=9.1.0",
    "typer>=0.15.0"
]

[project.urls]
repository = "https://github.com/aws-bench/aws-bench.git"

[project.scripts]
aws-bench = "aws_bench.cli.main:app"

[project.optional-dependencies]
mlflow = [
    "mlflow-skinny>=3.0.0",
    "requests-auth-aws-sigv4",
    "gitpython>=3.1.52",
    "pyasn1>=0.6.4",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-autorefs>=1.2.0",
]
dev = [
    "commitizen>=4.2.2",
    "moto[all]>=5.0.0",
    "pre-commit>=4.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "pyright>=1.1.398",
    "ruff>=0.9.7",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.3.0",
    "setuptools>=83.0.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["aws_bench"]

[tool.ruff]
line-length = 100
exclude = [
    ".venv",
    "**/__pycache__",
    "**/dist",
    "**/build"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = ["C", "D", "E", "F", "I", "W"]
ignore = ["C901", "D100", "D106"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["D101", "D102", "D103", "D107"]
"aws_bench/__init__.py" = ["F401"]
"aws_bench/agents/baseline_agent/system_prompt.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aws_bench"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["aws_bench", "tests"]
# baseline_agent/main.py is container payload (base64-uploaded into the scenario
# image and run there); it imports `strands`, installed in the container, not the
# host venv — so it can't be type-checked against the host environment.
exclude = ["**/__pycache__", "**/.venv", "scripts", "aws_bench/agents/baseline_agent/main.py"]

[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = ["tests"]
# Fail with the stuck test's stack instead of hanging (e.g. a unit test that
# accidentally hits a real retry/poll sleep).
timeout = 30
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.coverage.run]
source = ["aws_bench"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
]
update_changelog_on_bump = true

[tool.coverage.report]
fail_under = 85
exclude_also = [
    'pragma: no cover',
    'if __name__ == .__main__.:\n    main()',
]
